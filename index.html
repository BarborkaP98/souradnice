<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Souřadnice</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
}

canvas{
    border: none;
    margin-top: 20px;
}
</style>

</head>
<body>

<h1>Procvičování souřadnic</h1>

<p>Klikni do sítě.</p>

<p id="souradnice">Souřadnice:</p>

<canvas id="platno" width="550" height="550"></canvas>

<script>

const canvas = document.getElementById("platno");
const ctx = canvas.getContext("2d");

const krok = 50;

function nakresliSit(){

    ctx.clearRect(0,0,550,550);

    // mřížka
    for(let i = 0; i <= 10; i++){

        ctx.beginPath();
        ctx.moveTo(25 + i*krok, 25);
        ctx.lineTo(25 + i*krok, 525);
        ctx.strokeStyle = "#cccccc";
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(25, 25 + i*krok);
        ctx.lineTo(525, 25 + i*krok);
        ctx.stroke();
    }

    // osa X
    ctx.beginPath();
    ctx.moveTo(25,525);
    ctx.lineTo(540,525);
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();

    // šipka osy X
    ctx.beginPath();
    ctx.moveTo(540,525);
    ctx.lineTo(532,520);
    ctx.lineTo(532,530);
    ctx.closePath();
    ctx.fill();

    // osa Y
    ctx.beginPath();
    ctx.moveTo(25,525);
    ctx.lineTo(25,10);
    ctx.stroke();

    // šipka osy Y
    ctx.beginPath();
    ctx.moveTo(25,10);
    ctx.lineTo(20,18);
    ctx.lineTo(30,18);
    ctx.closePath();
    ctx.fill();

    // číslování X
    for(let i=0;i<=10;i++){
        ctx.fillText(i,22 + i*krok,545);
    }

    // číslování Y
    for(let i=0;i<=10;i++){
        ctx.fillText(i,5,(10-i)*krok+30);
    }

    // označení os
    ctx.font = "18px Arial";
    ctx.fillText("x",520,515);
    ctx.fillText("y",35,25);
}

nakresliSit();

canvas.addEventListener("click", function(e){

    const rect = canvas.getBoundingClientRect();

    const x = Math.round((e.clientX - rect.left - 25)/krok);
    const y = 10 - Math.round((e.clientY - rect.top - 25)/krok);

    document.getElementById("souradnice").innerText =
        `Souřadnice: [${x},${y}]`;

    ctx.beginPath();
    ctx.arc(
        x*krok + 25,
        (10-y)*krok + 25,
        5,
        0,
        2 * Math.PI
    );
    ctx.fill();
});

</script>

</body>
</html>
