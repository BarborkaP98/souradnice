<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Souřadnice</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
}

canvas{
    border: none;
    margin-top: 20px;
}
</style>

</head>
<body>

<h1>Procvičování souřadnic</h1>

<p>Klikni do sítě.</p>

<p id="souradnice">Souřadnice:</p>

<canvas id="platno" width="620" height="620"></canvas>

<script>

const canvas = document.getElementById("platno");
const ctx = canvas.getContext("2d");

const krok = 50;

function nakresliSit(){

    ctx.clearRect(0,0,620,620);

    // mřížka
    for(let i = 0; i <= 10; i++){

        ctx.beginPath();
        ctx.moveTo(25 + i*krok, 25);
        ctx.lineTo(25 + i*krok, 525);
        ctx.strokeStyle = "#d0d0d0";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(25, 25 + i*krok);
        ctx.lineTo(525, 25 + i*krok);
        ctx.stroke();
    }

    // osa X
    ctx.beginPath();
    ctx.moveTo(25,525);
    ctx.lineTo(545,525);
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();

    // šipka X
    ctx.beginPath();
    ctx.moveTo(545,525);
    ctx.lineTo(535,520);
    ctx.lineTo(535,530);
    ctx.closePath();
    ctx.fill();

    // osa Y
    ctx.beginPath();
    ctx.moveTo(25,525);
    ctx.lineTo(25,5);
    ctx.stroke();
    
    // šipka Y
    ctx.beginPath();
    ctx.moveTo(25,5);
    ctx.lineTo(20,15);
    ctx.lineTo(30,15);
    ctx.closePath();
    ctx.fill();

    // čísla na ose X
    ctx.font = "14px Arial";
    for(let i=0;i<=10;i++){
        ctx.fillText(i,20 + i*krok,545);
    }

    // čísla na ose Y
    for(let i=0;i<=10;i++){
        ctx.fillText(i,5,(10-i)*krok+30);
    }

    // označení os
    ctx.font = "bold 22px Arial";

    // x za šipkou
    ctx.fillText("x",560,532);

    // y nad šipkou
    ctx.fillText("y",18,18);
}

nakresliSit();

canvas.addEventListener("click", function(e){

    const rect = canvas.getBoundingClientRect();

    const x = Math.round((e.clientX - rect.left - 25)/krok);
    const y = 10 - Math.round((e.clientY - rect.top - 25)/krok);

    document.getElementById("souradnice").innerText =
        `Souřadnice: [${x},${y}]`;

    ctx.beginPath();
    ctx.arc(
        x*krok + 25,
        (10-y)*krok + 25,
        5,
        0,
        2 * Math.PI
    );
    ctx.fill();
});

</script>

</body>
</html>
