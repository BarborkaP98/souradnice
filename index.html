<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Souřadnice</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
}

canvas{
    margin-top:20px;
}

h1{
    margin-bottom:10px;
}
</style>
</head>

<body>

<h1>Procvičování souřadnic</h1>

<p id="vypis">Klikni do sítě.</p>

<canvas id="platno" width="650" height="700"></canvas>

<script>

const canvas = document.getElementById("platno");
const ctx = canvas.getContext("2d");

const krok = 50;

const levyOkraj = 50;
const horniOkraj = 100;
const velikost = 500;

function nakresliSit(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // mřížka
    ctx.strokeStyle = "#d8d8d8";
    ctx.lineWidth = 1;

    for(let i=0;i<=10;i++){

        ctx.beginPath();
        ctx.moveTo(levyOkraj + i*krok, horniOkraj);
        ctx.lineTo(levyOkraj + i*krok, horniOkraj + velikost);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(levyOkraj, horniOkraj + i*krok);
        ctx.lineTo(levyOkraj + velikost, horniOkraj + i*krok);
        ctx.stroke();
    }

    // osa X
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(levyOkraj, horniOkraj + velikost);
    ctx.lineTo(levyOkraj + velikost + 20, horniOkraj + velikost);
    ctx.stroke();

    // šipka X
    ctx.beginPath();
    ctx.moveTo(levyOkraj + velikost + 20, horniOkraj + velikost);
    ctx.lineTo(levyOkraj + velikost + 10, horniOkraj + velikost - 6);
    ctx.lineTo(levyOkraj + velikost + 10, horniOkraj + velikost + 6);
    ctx.closePath();
    ctx.fill();

    // osa Y
    ctx.beginPath();
    ctx.moveTo(levyOkraj, horniOkraj + velikost);
    ctx.lineTo(levyOkraj, horniOkraj - 30);
    ctx.stroke();

    // šipka Y
    ctx.beginPath();
    ctx.moveTo(levyOkraj, horniOkraj - 30);
    ctx.lineTo(levyOkraj - 6, horniOkraj - 18);
    ctx.lineTo(levyOkraj + 6, horniOkraj - 18);
    ctx.closePath();
    ctx.fill();

    // číslování X
    ctx.font = "14px Arial";

    for(let i=0;i<=10;i++){

        ctx.fillText(
            i,
            levyOkraj + i*krok - 5,
            horniOkraj + velikost + 22
        );
    }

    // číslování Y
    for(let i=0;i<=10;i++){

        ctx.fillText(
            i,
            levyOkraj - 22,
            horniOkraj + velikost - i*krok + 5
        );
    }

    // označení os
    ctx.font = "bold 22px Arial";

    ctx.fillText(
        "x",
        levyOkraj + velikost + 30,
        horniOkraj + velikost + 8
    );

    ctx.fillText(
        "y",
        levyOkraj - 7,
        horniOkraj - 45
    );
}

nakresliSit();

canvas.addEventListener("click", function(e){

    const rect = canvas.getBoundingClientRect();

    const x = Math.round(
        (e.clientX - rect.left - levyOkraj) / krok
    );

    const y = 10 - Math.round(
        (e.clientY - rect.top - horniOkraj) / krok
    );

    if(
        x < 0 || x > 10 ||
        y < 0 || y > 10
    ){
        return;
    }

    ctx.beginPath();
    ctx.arc(
        levyOkraj + x*krok,
        horniOkraj + (10-y)*krok,
        5,
        0,
        Math.PI * 2
    );
    ctx.fill();

    document.getElementById("vypis").textContent =
        `Souřadnice: [${x},${y}]`;
});

</script>

</body>
</html>
