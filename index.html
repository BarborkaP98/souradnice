<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Souřadnice</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
}

canvas{
    border: none;
    margin-top: 20px;
}
</style>

</head>
<body>

<h1>Procvičování souřadnic</h1>

<p>Klikni do sítě.</p>

<p id="souradnice">Souřadnice:</p>

<canvas id="platno" width="620" height="670"></canvas>

<script>

const canvas = document.getElementById("platno");
const ctx = canvas.getContext("2d");

const krok = 50;

function nakresliSit(){

    const levyOkraj = 50;
    const horniOkraj = 75;
    const velikostSite = 500;

    ctx.clearRect(0,0,620,670);

    // mřížka
    for(let i = 0; i <= 10; i++){

        ctx.beginPath();
        ctx.moveTo(levyOkraj + i*krok, horniOkraj);
        ctx.lineTo(levyOkraj + i*krok, horniOkraj + velikostSite);
        ctx.strokeStyle = "#d0d0d0";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(levyOkraj, horniOkraj + i*krok);
        ctx.lineTo(levyOkraj + velikostSite, horniOkraj + i*krok);
        ctx.stroke();
    }

    // osa X
    ctx.beginPath();
    ctx.moveTo(levyOkraj, horniOkraj + velikostSite);
    ctx.lineTo(levyOkraj + velikostSite + 20, horniOkraj + velikostSite);
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();

    // šipka X
    ctx.beginPath();
    ctx.moveTo(levyOkraj + velikostSite + 20, horniOkraj + velikostSite);
    ctx.lineTo(levyOkraj + velikostSite + 10, horniOkraj + velikostSite - 5);
    ctx.lineTo(levyOkraj + velikostSite + 10, horniOkraj + velikostSite + 5);
    ctx.closePath();
    ctx.fill();

    // osa Y
    ctx.beginPath();
    ctx.moveTo(levyOkraj, horniOkraj + velikostSite);
    ctx.lineTo(levyOkraj, horniOkraj - 30);
    ctx.stroke();

    // šipka Y
    ctx.beginPath();
    ctx.moveTo(levyOkraj, horniOkraj - 30);
    ctx.lineTo(levyOkraj - 5, horniOkraj - 20);
    ctx.lineTo(levyOkraj + 5, horniOkraj - 20);
    ctx.closePath();
    ctx.fill();

    // čísla na ose X
    ctx.font = "14px Arial";
    for(let i=0;i<=10;i++){
        ctx.fillText(
            i,
            levyOkraj - 5 + i*krok,
            horniOkraj + velikostSite + 22
        );
    }

    // čísla na ose Y
    for(let i=0;i<=10;i++){
        ctx.fillText(
            i,
            levyOkraj - 22,
            horniOkraj + velikostSite - i*krok + 5
        );
    }

    // označení os
    ctx.font = "bold 22px Arial";

    // x za šipkou
    ctx.fillText(
        "x",
        levyOkraj + velikostSite + 30,
        horniOkraj + velikostSite + 8
    );

    // y NAD šipkou
    ctx.fillText(
        "y",
        levyOkraj - 7,
        horniOkraj - 45
    );
}

nakresliSit();

canvas.addEventListener("click", function(e){

    const rect = canvas.getBoundingClientRect();

    const x = Math.round((e.clientX - rect.left - 25)/krok);
    const y = 10 - Math.round((e.clientY - rect.top - 25)/krok);

    document.getElementById("souradnice").innerText =
        `Souřadnice: [${x},${y}]`;

    ctx.beginPath();
    const levyOkraj = 50;
const horniOkraj = 75;

ctx.arc(
    levyOkraj + x*krok,
    horniOkraj + (10-y)*krok,
    5,
    0,
    2 * Math.PI
);
    ctx.fill();
});

</script>

</body>
</html>
